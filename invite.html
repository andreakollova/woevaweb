<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pozvánka · Woeva</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      background: #0a0a09;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    .card {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      padding: 32px 24px 28px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      font-weight: 800;
      color: #B9FF00;
      letter-spacing: -1px;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #000;
      letter-spacing: -0.4px;
      text-align: center;
      margin-bottom: 6px;
    }

    .invite-by {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 16px;
    }

    .invite-by strong { color: #000; }

    .desc-box {
      background: #f5f5f5;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }

    .desc-box p {
      font-size: 13px;
      color: #666;
      text-align: center;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 0 0 20px;
    }

    .btn-open {
      display: block;
      width: 100%;
      padding: 16px;
      background: #B9FF00;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      color: #000;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn-open:active { opacity: 0.8; }

    .btn-store {
      display: block;
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1.5px solid #e0e0e0;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-store:active { background: #f5f5f5; }

    .loading-line {
      height: 18px;
      background: #f0f0f0;
      border-radius: 8px;
      margin: 6px auto;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .error { text-align: center; color: #666; font-size: 15px; line-height: 1.5; }
    .error strong { display: block; color: #000; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">
      <div class="loading-line" style="width:72px;height:72px;border-radius:50%;margin-bottom:16px"></div>
      <div class="loading-line" style="width:50%"></div>
      <div class="loading-line" style="width:70%;margin-bottom:20px"></div>
    </div>

    <div id="inviteInfo" style="display:none">
      <div class="avatar" id="clubAvatar"></div>
      <div class="label">Pozvánka do klubu</div>
      <h1 id="clubName"></h1>
      <p class="invite-by" id="inviteBy"></p>
      <div class="desc-box"><p id="roleDesc"></p></div>
    </div>

    <div id="errorInfo" style="display:none" class="error">
      <strong>Pozvánka neplatná</strong>
      Táto pozvánka už bola použitá alebo vypršala jej platnosť.
    </div>

    <div class="divider"></div>

    <a id="openBtn" class="btn-open" href="#" style="display:none">Otvoriť v Woeva</a>
    <a class="btn-store" href="https://apps.apple.com/sk/app/woeva/id6767314046?l=sk" target="_blank">
      Stiahnuť Woeva
    </a>
  </div>

  <script>
    const SUPABASE_URL = 'https://cjljktituvuamjwksuxg.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbGprdGl0dXZ1YW1qd2tzdXhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODQzMTcsImV4cCI6MjA5Mjk2MDMxN30.8KToU2sarmrqvcO8cXlhs4vDA1TC-sOMyg4Mm8NCNxI';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || window.location.pathname.split('/').filter(Boolean).pop();

    async function loadInvite() {
      if (!token) { showError(); return; }

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/pending_invites?token=eq.${token}&select=club_name,inviter_name,role,status,expires_at`,
          { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
        );
        const data = await res.json();
        const invite = data[0];

        document.getElementById('loading').style.display = 'none';

        if (!invite || invite.status !== 'pending' || new Date(invite.expires_at) < new Date()) {
          showError(); return;
        }

        document.title = `Pozvánka do ${invite.club_name} · Woeva`;
        document.getElementById('clubAvatar').textContent = invite.club_name.charAt(0).toUpperCase();
        document.getElementById('clubName').textContent = invite.club_name;

        const roleLabel = invite.role === 'admin' ? 'správcu' : 'koordinátora';
        document.getElementById('inviteBy').innerHTML = `<strong>${invite.inviter_name}</strong> ťa pozýva ako ${roleLabel}`;

        const roleDesc = invite.role === 'admin'
          ? 'Budeš môcť spravovať eventy, členov a nastavenia klubu.'
          : 'Budeš môcť skenovať QR kódy a potvrdzovať príchody na eventy.';
        document.getElementById('roleDesc').textContent = roleDesc;

        document.getElementById('inviteInfo').style.display = 'block';

        const deepLink = `woeva://invite/${token}`;
        const openBtn = document.getElementById('openBtn');
        openBtn.href = deepLink;
        openBtn.style.display = 'block';

        openBtn.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = deepLink;
        });

        // Auto-try to open app on mobile
        if (/iPhone|iPad|Android/i.test(navigator.userAgent)) {
          setTimeout(() => { window.location.href = deepLink; }, 600);
        }

      } catch {
        showError();
      }
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('errorInfo').style.display = 'block';
    }

    loadInvite();
  </script>
</body>
</html>
