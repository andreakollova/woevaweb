<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woeva</title>
  <style>
    body { margin: 0; background: #0a0a0a; }
  </style>
</head>
<body>
  <script>
    var path = window.location.pathname;
    var clubId = path.split('/').filter(Boolean).pop();
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    var isAndroid = /Android/i.test(navigator.userAgent);

    if (clubId) {
      window.location.href = 'woeva://club/' + clubId;

      setTimeout(function() {
        if (isIOS) {
          window.location.href = 'https://apps.apple.com/app/woeva/id6746527862';
        } else if (isAndroid) {
          window.location.href = 'https://play.google.com/store/apps/details?id=com.woeva.app';
        } else {
          window.location.href = 'https://woeva.com';
        }
      }, 1500);
    } else {
      window.location.href = 'https://woeva.com';
    }
  </script>
</body>
</html>
