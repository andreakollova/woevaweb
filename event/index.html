<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woeva</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      background: #0a0a09;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    .card {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .cover {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #1a1a1a;
      display: block;
    }

    .cover-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #B9FF00 0%, #7acc00 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-placeholder img {
      height: 40px;
      opacity: 0.6;
    }

    .content {
      padding: 20px 20px 24px;
    }

    .meta {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #000;
      letter-spacing: -0.4px;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .detail-row svg {
      flex-shrink: 0;
      opacity: 0.45;
    }

    .detail-text {
      font-size: 13px;
      color: #444;
    }

    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 16px 0;
    }

    .btn-open {
      display: block;
      width: 100%;
      padding: 16px;
      background: #000;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn-open:active { opacity: 0.8; }

    .btn-store {
      display: block;
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1.5px solid #e0e0e0;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-store:active { background: #f5f5f5; }

    .loading-title {
      height: 22px;
      background: #f0f0f0;
      border-radius: 8px;
      width: 75%;
      margin-bottom: 8px;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    .loading-meta {
      height: 14px;
      background: #f0f0f0;
      border-radius: 6px;
      width: 50%;
      margin-bottom: 16px;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="cover-placeholder" id="coverPlaceholder">
      <img src="/LogoWoeva.png" alt="Woeva" />
    </div>
    <img id="coverImg" class="cover" style="display:none" alt="" />

    <div class="content">
      <div id="loading">
        <div class="loading-meta"></div>
        <div class="loading-title"></div>
        <div class="loading-title" style="width:55%"></div>
      </div>

      <div id="eventInfo" style="display:none">
        <div class="meta" id="metaDate"></div>
        <h1 id="eventTitle"></h1>
        <p class="tagline" id="eventTagline" style="display:none"></p>

        <div class="detail-row" id="venueRow" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#000"/>
          </svg>
          <span class="detail-text" id="venueText"></span>
        </div>

        <div class="detail-row" id="priceRow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#000" stroke-width="2"/>
            <path d="M12 6v6l4 2" stroke="#000" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="detail-text" id="priceText"></span>
        </div>
      </div>

      <div class="divider"></div>

      <a id="openBtn" class="btn-open" href="#">Otvoriť vo Woeva</a>
      <a id="storeBtn" class="btn-store" href="https://apps.apple.com/sk/app/woeva/id6738044714" target="_blank">
        Stiahnuť Woeva
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cjljktituvuamjwksuxg.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbGprdGl0dXZ1YW1qd2tzdXhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODQzMTcsImV4cCI6MjA5Mjk2MDMxN30.8KToU2sarmrqvcO8cXlhs4vDA1TC-sOMyg4Mm8NCNxI';

    // Extract event ID from URL path: /event/[id]
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const eventId = pathParts[pathParts.length - 1];

    const deepLink = `woeva://event/${eventId}`;
    document.getElementById('openBtn').href = deepLink;

    // Try to open the app immediately
    window.location.href = deepLink;

    // Fetch event data
    async function loadEvent() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/events?id=eq.${eventId}&select=title,tagline,date,time,venue,cover_url,price,is_free,pay_at_door,city`,
          { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
        );
        const data = await res.json();
        const event = data[0];
        if (!event) return;

        document.title = `${event.title} · Woeva`;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('eventInfo').style.display = 'block';
        document.getElementById('eventTitle').textContent = event.title;

        if (event.tagline) {
          document.getElementById('eventTagline').textContent = event.tagline;
          document.getElementById('eventTagline').style.display = 'block';
        }

        if (event.cover_url) {
          const img = document.getElementById('coverImg');
          img.src = event.cover_url;
          img.style.display = 'block';
          document.getElementById('coverPlaceholder').style.display = 'none';
        }

        if (event.date) {
          const d = new Date(event.date + 'T00:00:00');
          const days = ['Ne','Po','Ut','St','Št','Pi','So'];
          const months = ['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];
          const timeStr = event.time ? ` · ${event.time.slice(0,5)}` : '';
          document.getElementById('metaDate').textContent = `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]}${timeStr}`;
        }

        if (event.venue) {
          document.getElementById('venueRow').style.display = 'flex';
          document.getElementById('venueText').textContent = event.venue + (event.city ? `, ${event.city}` : '');
        }

        const isFree = event.is_free || event.price === 0;
        const isPayAtDoor = event.pay_at_door;
        document.getElementById('priceText').textContent = isFree ? 'Zadarmo' : isPayAtDoor ? `€${event.price} na mieste` : `€${event.price}`;
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('eventInfo').style.display = 'block';
        document.getElementById('eventTitle').textContent = 'Woeva Event';
      }
    }

    loadEvent();

    document.getElementById('openBtn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = deepLink;
    });
  </script>
</body>
</html>
