<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platby nastavené · Woeva</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      background: #f5f5f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    .phone {
      width: min(360px, 90vw);
      background: #fff;
      border-radius: 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.18);
      overflow: hidden;
      position: relative;
    }

    /* Content */
    .content {
      padding: 36px 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .logo {
      height: 28px;
      margin-bottom: 32px;
    }

    .check-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #B9FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      font-size: 38px;
      line-height: 1;
    }
    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #000;
      text-align: center;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #666;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .hint {
      font-size: 15px;
      font-weight: 700;
      color: #000;
      text-align: center;
      line-height: 1.6;
      background: #f0f0eb;
      border-radius: 14px;
      padding: 14px 18px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="content">
      <img src="/LogoWoeva.png" alt="Woeva" class="logo" />

      <div class="check-ring">🎉</div>

      <h1>Platby sú nastavené!</h1>
      <p>Teraz môžeš prijímať platby za tvoje eventy priamo v appke. Všetko je pripravené.</p>

      <p class="hint">Stlač ✓ vľavo hore pre návrat do aplikácie</p>
    </div>
  </div>
</body>
</html>
